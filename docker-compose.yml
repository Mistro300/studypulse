services:
  postgres:
    image: postgres:16-alpine
    container_name: studypulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studypulse
      POSTGRES_PASSWORD: studypulse
      POSTGRES_DB: studypulse
    ports:
      - "5432:5432"
    volumes:
      - studypulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studypulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studypulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studypulse_pgdata:
